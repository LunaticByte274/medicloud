AWSTemplateFormatVersion: '2010-09-09'
Description: 'MediCloud Least-Privilege Security Groups for ALB, EC2 Backend, and RDS PostgreSQL'

Parameters:
  EnvironmentName:
    Type: String
    Default: medicloud-production
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where Security Groups will be provisioned

Resources:
  # 1. Application Load Balancer Security Group
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS ingress for MediCloud Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Inbound HTTP from Internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Inbound HTTPS from Internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'
        - Key: Project
          Value: MediCloud

  # 2. EC2 Compute Security Group (Node.js API & Background Worker)
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted ingress for EC2 compute instance from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Inbound HTTP on API port strictly from ALB
        # Optional SSH port 22 restricted to administrator IP only
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Admin SSH access (recommended: replace with your personal IP or SSM Session Manager)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound HTTPS to AWS services (S3, SQS, SNS, SSM, CloudWatch)
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-sg'
        - Key: Project
          Value: MediCloud

  # 3. RDS PostgreSQL Managed Database Security Group
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Isolated database ingress strictly from EC2 application tier
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: Inbound PostgreSQL strictly from EC2 compute instances
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: Block all outbound traffic from database tier
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-sg'
        - Key: Project
          Value: MediCloud

Outputs:
  ALBSecurityGroupId:
    Description: Security Group ID for Application Load Balancer
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-ALBSecurityGroupId'
  EC2SecurityGroupId:
    Description: Security Group ID for EC2 Compute
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-EC2SecurityGroupId'
  RDSSecurityGroupId:
    Description: Security Group ID for RDS Database
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-RDSSecurityGroupId'
