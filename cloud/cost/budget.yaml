AWSTemplateFormatVersion: '2010-09-09'
Description: 'MediCloud AWS Budgets Cost Control Alert Template ($15 Monthly Threshold)'

Parameters:
  BudgetAmountUSD:
    Type: Number
    Default: 15
    Description: Monthly budget limit in USD
  NotificationEmail:
    Type: String
    Default: 'student.cloud.team@example.com'
    Description: Email address for budget notifications

Resources:
  MediCloudMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: 'MediCloud-College-Project-Budget'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetAmountUSD
          Unit: USD
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          IncludeSupport: true
          IncludeDiscount: true
          UseAmortized: false
      NotificationsWithSubscribers:
        # Alert 1: Forecasted to exceed 85% of budget ($12.75)
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 85
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

        # Alert 2: Actual cost exceeds 100% of budget ($15.00)
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  BudgetName:
    Description: Configured AWS Budget Name
    Value: !Ref MediCloudMonthlyBudget
