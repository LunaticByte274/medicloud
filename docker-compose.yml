version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicloud-postgres
    restart: always
    environment:
      POSTGRES_USER: medicloud_user
      POSTGRES_PASSWORD: medicloud_secure_dev_password
      POSTGRES_DB: medicloud_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicloud_user -d medicloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
